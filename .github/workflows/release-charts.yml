name: Release Helm charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - "artifacthub-repo.yml"
      - ".github/workflows/release-charts.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Publish Artifact Hub repository metadata
        run: |
          git fetch origin gh-pages
          pages_dir="$(mktemp -d)"
          git worktree add -B gh-pages-metadata "$pages_dir" origin/gh-pages
          cp artifacthub-repo.yml "$pages_dir/artifacthub-repo.yml"
          cd "$pages_dir"
          git add artifacthub-repo.yml
          if git diff --cached --quiet -- artifacthub-repo.yml; then
            echo "Artifact Hub repository metadata is already current."
          else
            git commit -m "Update Artifact Hub repository metadata"
            git push origin HEAD:gh-pages
          fi
